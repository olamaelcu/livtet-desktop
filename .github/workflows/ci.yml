name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The bindings generation step below builds `livtet-desktop` (and the two
    # sidecars its build.rs stages) whenever the Rust sources changed, so the
    # budget has to cover a cold build on top of the test run.
    timeout-minutes: 40

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `web/lib/bindings.ts` is gitignored and produced by a Rust binary, so a
      # fresh checkout cannot resolve `$lib/bindings`: vitest fails with
      # "Failed to resolve import" before the `vi.mock` factories get a chance
      # to substitute it. Producing it needs a full `livtet-desktop` build, so
      # cache the outputs against a hash of every Rust source that can change
      # the exported command surface.
      - name: Cache generated bindings + frontend prerequisites
        id: bindings-cache
        uses: actions/cache@v4
        with:
          path: |
            web/lib/bindings.ts
            build/
            .svelte-kit/
          key: bindings-prereqs-${{ runner.os }}-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            bindings-prereqs-${{ runner.os }}-

      - name: Generate TS bindings
        if: steps.bindings-cache.outputs.cache-hit != 'true'
        # `bash` pins the script across runners: the Windows default shell
        # (pwsh) has no `printf`.
        shell: bash
        run: |
          # build.rs aborts unless `.mise/secrets.env` exists and both values are
          # non-empty. Only the file's presence is load-bearing here: the web
          # suite never reads these, and this job ships no binary. Decrypting the
          # real bundle would mean installing mise + sops + age, which fails on
          # the Windows runner.
          printf 'GOOGLE_BOOKS_API_KEY=ci\nSENTRY_DSN=ci\n' > .mise/secrets.env
          # `tauri::generate_context!()` panics while `build/` (frontendDist) is
          # missing -- the same placeholder `mise run seed-frontend-dist` writes.
          mkdir -p build
          [ -f build/index.html ] || printf '<!doctype html>\n' > build/index.html
          cargo run --features bindings-export --bin generate-bindings
          pnpm exec svelte-kit sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # Playwright's default browser directory is per-OS, and only one of
          # them exists on any given runner, so list all three.
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # `--with-deps` installs apt packages, which only exists on Linux; the
      # macOS and Windows images already ship what Chromium needs.
      - name: Install Playwright browsers
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Run unit + browser tests
        run: pnpm test

      - name: Run E2E tests
        if: runner.os == 'Linux'
        run: pnpm exec svelte-kit sync && pnpm test:e2e:browser

      - name: Upload E2E test results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/e2e
          retention-days: 7

  coverage:
    name: Coverage
    # Patch coverage is only meaningful against a base branch; on a push to
    # main the diff is empty, so the job would burn a full Rust build to
    # score nothing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # diff-cover resolves a merge base against origin/main; a shallow
          # checkout has no such commit and the preflight refuses to run.
          fetch-depth: 0

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_DATA_DIR=$HOME/.mise" >> "$GITHUB_ENV"
          mise install
          eval "$(mise activate --sh)" && echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Decrypt mise secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: mise run secrets-export-env

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: coverage

      - name: Install LLVM coverage tools
        run: rustup component add llvm-tools-preview

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: mise exec -- pnpm exec playwright install --with-deps chromium

      - name: Run coverage gate
        run: mise run coverage:gate

      - name: Write patch coverage summary
        if: always()
        run: |
          if [ -f target/coverage/patch.md ]; then
            cat target/coverage/patch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Patch coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No report produced -- the preflight refused before scoring." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            target/coverage/patch.html
          retention-days: 7

  ci:
    name: CI Summary
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more jobs failed"
          exit 1

      - name: Success
        run: echo "✅ All checks passed"