name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_DATA_DIR=$HOME/.mise" >> "$GITHUB_ENV"
          mise install
          eval "$(mise activate --sh)" && echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Decrypt mise secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: mise run secrets-export-env

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Run lint
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_DATA_DIR=$HOME/.mise" >> "$GITHUB_ENV"
          mise install
          eval "$(mise activate --sh)" && echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Decrypt mise secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: mise run secrets-export-env

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri -> target

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: mise exec -- pnpm install --frozen-lockfile

      - name: Run tests
        run: mise run test

  ci:
    name: CI Summary
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Success
        if: needs.all.result == 'success'
        run: echo "✅ All checks passed"

      - name: Failures
        if: needs.any.result == 'failure'
        run: |
          echo "::error::One or more jobs failed"
          exit 1