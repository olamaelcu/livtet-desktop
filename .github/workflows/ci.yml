name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests pay for whatever changed and nothing else: a docs-only diff
  # skips the whole test matrix, and a diff with no Rust sources skips the Rust
  # half of it. Pushes to main and manual runs bypass the filter (no base commit
  # to diff against) and always run everything.
  changes:
    name: Changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      # Which job runs the Rust suite. On a ready same-repo pull request the
      # coverage legs already build and execute it (instrumented), so the test
      # job skips its own run; on pushes, drafts and fork PRs — where coverage is
      # skipped — the test job keeps it. Empty on pushes (this job is skipped),
      # which compares unequal to 'true' and therefore means "test runs it".
      rust_in_coverage: ${{ steps.split.outputs.rust_in_coverage }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vendor/**'
              - 'mise.toml'
            web:
              - 'web/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vite.config.js'
              - 'vitest.config.ts'
              - 'svelte.config.js'
              - 'scripts/**'
              - 'static/**'
            # Anything that can break a build, a test, or the lint gate.
            code:
              - 'crates/**'
              - 'web/**'
              - 'e2e/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'vendor/**'
              - 'mise.toml'
              - 'vite.config.js'
              - 'vitest.config.ts'
              - 'svelte.config.js'
              - 'scripts/**'
              - 'static/**'
              - 'biome.json'
              - '.gitattributes'
              - '.mise/**'
              - '.github/workflows/**'

      - name: Decide which job runs the Rust suite
        id: split
        shell: bash
        run: |
          # Must stay in step with the coverage job's `if`: whatever that job
          # skips, this job has to cover.
          if [ "${{ github.event.pull_request.draft }}" = 'false' ] &&
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo 'rust_in_coverage=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust_in_coverage=false' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    # `always()` is load-bearing: `changes` is skipped on pushes, and GitHub skips
    # any job whose `needs` job was skipped unless the condition overrides that.
    # Without it this job silently disappeared from every push to main (it showed
    # up as a skipped job named literally "Test (${{ matrix.os }})").
    if: >
      always() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true')
    strategy:
      fail-fast: false
      matrix:
        # Static: `matrix` is not available to a job-level `if`, so the PR and
        # draft narrowing lives in the per-step conditions below, which can read
        # it. (`fromJSON` here also produced no jobs at all on push events.)
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The bindings step below builds `livtet-desktop` (and the two sidecars its
    # build.rs stages) whenever the Rust sources changed, and the Rust suite
    # then builds the test targets on top of it, so the budget has to cover a
    # cold build plus both suites.
    timeout-minutes: 60

    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # The second entry covers `build.rs`'s nested sidecar builds. The
          # default `. -> target` mapping misses them entirely, so
          # `livtet-plugin-host` and `livtet-sync-daemon` are rebuilt from
          # scratch on every run (~4 GB of artifacts locally, and pure compile
          # time on Windows).
          workspaces: |
            . -> target
            crates/livtet-desktop -> target

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Defender scans every write under the workspace, temp and cargo dirs, which
      # dominates the Windows leg: the same Rust suite takes 5.1 min of test
      # execution here against 21.5s on Linux, with compilation and the SQLite
      # temp files on the same path. Excluding them is the documented remedy for
      # MSVC builds; the runner is discarded after the job.
      - name: Exclude build paths from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $excluded = @(Get-MpPreference | Select-Object -ExpandProperty ExclusionPath)
          $candidates = @(
            '${{ github.workspace }}',
            $env:RUNNER_TEMP,
            $env:CARGO_HOME,
            (Join-Path $env:USERPROFILE '.cargo')
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          foreach ($path in $candidates) {
            if ($excluded -notcontains $path) {
              Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
            }
          }

          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

      # Two things every Rust build in this job needs, kept out of the
      # cache-gated step below so a bindings cache hit cannot starve the Rust
      # suite: `build.rs` aborts unless `.mise/secrets.env` exists, and
      # `tauri::generate_context!()` panics while `build/` (frontendDist) is
      # missing -- the same placeholder `mise run seed-frontend-dist` writes.
      - name: Prepare Rust build prerequisites
        # `bash` pins the script across runners: the Windows default shell
        # (pwsh) has no `printf`.
        # Unconditional on purpose: a web-only PR skips the Rust suite but may
        # still need these when the bindings cache misses and `generate-bindings`
        # compiles the crate.
        shell: bash
        run: |
          # Only the file's presence is load-bearing: neither suite reads these
          # values, and this job ships no binary. Decrypting the real bundle
          # would mean installing mise + sops + age, which fails on the Windows
          # runner.
          printf 'GOOGLE_BOOKS_API_KEY=ci\nSENTRY_DSN=ci\n' > .mise/secrets.env
          mkdir -p build
          [ -f build/index.html ] || printf '<!doctype html>\n' > build/index.html

      # `web/lib/bindings.ts` is gitignored and produced by a Rust binary, so a
      # fresh checkout cannot resolve `$lib/bindings`: vitest fails with
      # "Failed to resolve import" before the `vi.mock` factories get a chance
      # to substitute it. Producing it needs a full `livtet-desktop` build, so
      # cache the outputs against a hash of every Rust source that can change
      # the exported command surface.
      - name: Cache generated bindings + frontend prerequisites
        id: bindings-cache
        # Web checks run on Linux for pull requests: the suites are
        # platform-agnostic, and generating bindings on Windows costs a full
        # crate compile for 20 seconds of tests. Pushes still cover every leg.
        if: github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            web/lib/bindings.ts
            build/
            .svelte-kit/
          # Hash only what can change the exported command/type surface: the
          # desktop crate's own sources (its dependencies all come from the
          # external `livtet` checkout, pinned by Cargo.lock) plus the manifests
          # and lock. Hashing every crate meant a test-only or sidecar commit
          # still missed the cache and rebuilt the generator from scratch.
          key: bindings-prereqs-${{ runner.os }}-${{ hashFiles('crates/livtet-desktop/src/**/*.rs', 'crates/livtet-desktop/Cargo.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            bindings-prereqs-${{ runner.os }}-

      - name: Generate TS bindings
        if: >
          (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') &&
          steps.bindings-cache.outputs.cache-hit != 'true'
        run: |
          cargo run --features bindings-export --bin generate-bindings
          pnpm exec svelte-kit sync

      # The Rust half of `mise run test`, which CI otherwise never invokes: a
      # push to main skips the coverage job, and that job is the only other
      # place `cargo test` executes. The workspace is already compiled by the
      # bindings step above, so this only adds the test targets.
      - name: Install cargo-nextest
        # Rust runs on every leg for main, but PRs skip macOS and drafts skip
        # everything but Linux: macOS has never produced a Rust failure the other
        # legs missed.
        if: >
          needs.changes.outputs.rust_in_coverage != 'true' &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.rust == 'true' && matrix.os != 'macos-latest' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.150

      - name: Run Rust tests
        # `--no-fail-fast` keeps going after a failure: the first Windows run
        # aborted at 316/659 and hid every test behind it, costing an extra push
        # to discover the rest. nextest rejects it alongside `--max-fail`, so no
        # cap is set.
        if: >
          needs.changes.outputs.rust_in_coverage != 'true' &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.rust == 'true' && matrix.os != 'macos-latest' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        run: |
          cargo test --doc --workspace --no-fail-fast
          cargo nextest run --workspace --all-targets --no-fail-fast

      - name: Cache Playwright browsers
        if: >
          (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.web == 'true' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        uses: actions/cache@v4
        with:
          # Playwright's default browser directory is per-OS, and only one of
          # them exists on any given runner, so list all three.
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # `--with-deps` installs apt packages, which only exists on Linux; the
      # macOS and Windows images already ship what Chromium needs.
      - name: Install Playwright browsers
        if: >
          (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') &&
          runner.os == 'Linux' &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.web == 'true' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers
        if: >
          (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') &&
          runner.os != 'Linux' &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.web == 'true' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        run: npx playwright install chromium

      - name: Run unit + browser tests
        if: >
          (github.event_name != 'pull_request' || matrix.os == 'ubuntu-latest') &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.web == 'true' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        run: pnpm test

      - name: Run E2E tests
        if: >
          runner.os == 'Linux' &&
          (github.event_name != 'pull_request' ||
           (needs.changes.outputs.web == 'true' &&
            (github.event.pull_request.draft == false || matrix.os == 'ubuntu-latest')))
        run: pnpm exec svelte-kit sync && pnpm test:e2e:browser

      - name: Upload E2E test results
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: test-results/e2e
          retention-days: 7

  coverage:
    name: Coverage (${{ matrix.os }})
    needs: changes
    # Patch coverage is only meaningful against a base branch; on a push to main
    # the diff is empty, so the job would burn a full Rust build to score
    # nothing. A pull request from a fork gets no secrets at all, so restricting
    # it to same-repo PRs keeps an external contribution from failing. Drafts
    # defer it until review starts, and a PR that touches neither Rust nor web
    # sources has nothing to score. Manual runs are allowed unconditionally so
    # the job can be exercised without opening a PR.
    if: >
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Three instrumented builds; the number is per leg, not the whole matrix.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # diff-cover resolves a merge base against origin/main; a shallow
          # checkout has no such commit and the preflight refuses to run.
          fetch-depth: 0

      # Tooling comes from the ecosystem's own actions rather than mise: the mise
      # installer is POSIX-only and `mise install` of the pinned tool set fails on
      # the Windows runner, which blocked running this leg there at all.
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Installed by hand rather than through the toolchain action: the action
      # resolves the *default* profile, which includes `rustfmt`, and rustup then
      # aborts with "detected conflict: 'bin/cargo-fmt'" against the runner's
      # pre-installed shim. `--profile minimal` installs only what this job uses
      # (cargo, rustc, rust-std) plus the one component it needs.
      - name: Install Rust toolchain with LLVM coverage tools
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal \
            --component llvm-tools-preview --no-self-update
          rustup default 1.97.0
          rustup component list --installed --toolchain 1.97.0

      - name: Install coverage tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Install diff-cover
        run: python -m pip install --disable-pip-version-check diff-cover==10.6

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Same sidecar mapping as the test job: the coverage build runs
          # `build.rs` too, and this job is the PR critical path.
          workspaces: |
            . -> target
            crates/livtet-desktop -> target
          key: coverage

      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `build.rs` aborts unless `.mise/secrets.env` exists, and
      # `tauri::generate_context!()` panics while `build/` is missing. Only the
      # file's presence is load-bearing, so no bundle decryption is needed here —
      # that also keeps this leg off `SOPS_AGE_KEY`.
      - name: Prepare Rust build prerequisites
        shell: bash
        run: |
          printf 'GOOGLE_BOOKS_API_KEY=ci\nSENTRY_DSN=ci\n' > .mise/secrets.env
          mkdir -p build
          [ -f build/index.html ] || printf '<!doctype html>\n' > build/index.html

      # `web/lib/bindings.ts` is gitignored and only a Rust build produces it, so
      # vitest cannot resolve `$lib/bindings` on a fresh checkout. Same key as the
      # test job, so the two share one entry.
      - name: Cache generated bindings
        id: bindings-cache
        uses: actions/cache@v4
        with:
          path: |
            web/lib/bindings.ts
            build/
            .svelte-kit/
          key: bindings-prereqs-${{ runner.os }}-${{ hashFiles('crates/livtet-desktop/src/**/*.rs', 'crates/livtet-desktop/Cargo.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            bindings-prereqs-${{ runner.os }}-

      - name: Generate TS bindings
        if: steps.bindings-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo run --features bindings-export --bin generate-bindings
          pnpm exec svelte-kit sync

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright browsers
        if: runner.os != 'Linux'
        run: pnpm exec playwright install chromium

      # Mirrors `mise run coverage:gate` (mise.toml is still the local source of
      # truth); `bash` pins the pipelines and the regex assembly across runners.
      - name: Run web coverage
        shell: bash
        run: |
          pnpm exec svelte-kit sync
          pnpm test:coverage

      - name: Run Rust coverage
        shell: bash
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov clean --workspace
          # Built by a script, not an inline pipeline: the patterns must match
          # Windows separators too, and the escaping has to survive shell and
          # YAML quoting on three operating systems.
          regex=$(node scripts/coverage-ignore-regex.mjs)
          [ -n "$regex" ]
          cargo llvm-cov --workspace --all-targets --no-report --ignore-filename-regex "($regex)"
          cargo llvm-cov report --lcov --output-path target/llvm-cov/rust.lcov --ignore-filename-regex "($regex)"

      - name: Normalize reports and score patch coverage
        shell: bash
        run: |
          node scripts/normalize-lcov.mjs
          diff-cover target/llvm-cov/rust.norm.lcov target/llvm-cov/web.norm.lcov \
            --compare-branch="${COVERAGE_COMPARE_BRANCH:-origin/main}" \
            --fail-under=85 \
            --markdown-report target/llvm-cov/patch.md \
            --html-report target/llvm-cov/patch.html

      - name: Write patch coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f target/llvm-cov/patch.md ]; then
            cat target/llvm-cov/patch.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Patch coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No report produced -- the preflight refused before scoring." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}
          path: |
            coverage/
            target/llvm-cov/patch.html
          retention-days: 7

  ci:
    name: CI Summary
    needs: [changes, lint, test, coverage]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more jobs failed"
          exit 1

      - name: Success
        run: echo "✅ All checks passed"