name: Code Quality

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  duplication:
    name: Detect Duplication (15+ lines)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_DISABLE_TOOLS: taskwarrior,pipx:taskwarrior-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "MISE_DATA_DIR=$HOME/.mise" >> "$GITHUB_ENV"
          mise install
          eval "$(mise activate --sh)" && echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: mise run secrets-export-env

      - name: Run duplication detection
        run: mise run check-dupes

      - name: Generate SARIF
        run: |
          python3 << 'PY'
          import json, os
          try:
              with open("check-dupes.json") as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              data = {"items": []}

          items = data.get("items", [])[:5]
          sarif = {
              "version": "2.1.0",
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "runs": [{
                  "tool": {"driver": {"name": "nose", "version": "0.20.0", "informationUri": "https://github.com/corca-ai/nose"}},
                  "results": [{
                      "ruleId": "duplicate-code",
                      "message": {"text": f"Exact duplicate of {len(i.get('files', []))} files ({i.get('metrics', {}).get('value', 'unknown')} tokens)"},
                      "locations": [{"physicalLocation": {"artifactLocation": {"uri": f.get('files', ['unknown'])[0]}}} for f in i.get('files', [])[:3]]
                  } for i in items]
              }]
          }
          with open("check-dupes.sarif", "w") as f:
              json.dump(sarif, f)
          PY

      - name: Write summary
        run: |
          python3 << 'PY'
          import json, os, sys
          try:
              with open("check-dupes.json") as f:
                  report = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              report = {"items": []}

          count = len(report.get("items", []))
          items = report.get("items", [])[:5]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Code Duplication Report\n")
              f.write(f"Found **{count}** copy-paste families with 15+ duplicate lines\n\n")
              if items:
                  f.write(f"### Top {len(items)} Findings\n")
                  for i, item in enumerate(items, 1):
                      files = item.get('files', [])
                      m = item.get('metrics', {})
                      f.write(f"{i}. `{files[0] if files else 'unknown'}` // {m.get('value', 'unknown')} tokens\n")

          print(f"Found {count} duplication families")
          PY

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: check-dupes.sarif
          category: nose-duplication