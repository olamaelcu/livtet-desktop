name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  # Where the package repositories are served from. This must match the custom
  # domain GitHub Pages has configured for the repository, and it is baked into
  # the files clients fetch (`livtet.list`, `livtet.flatpakrepo`), so changing it
  # is a client-visible break: existing installs keep pointing at the old host.
  PACKAGES_URL: https://download.livtet.olamaelcu.net

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The APT/Flatpak publishing and Homebrew tap steps need secrets that may
      # not be configured. A job-level `if` cannot read `secrets`, so decide
      # here and expose the answer as an output instead of failing the release
      # on an unconfigured distribution channel.
      homebrew_token: ${{ steps.channels.outputs.homebrew_token }}
      packages_key: ${{ steps.channels.outputs.packages_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: Check tag matches tauri.conf.json
        run: |
          set -euo pipefail
          version="$(jq -r .version crates/livtet-desktop/tauri.conf.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $version"
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: channels
        name: Detect optional distribution secrets
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "homebrew_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "homebrew_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update"
          fi
          if [ -n "$PACKAGES_GPG_KEY" ]; then
            echo "packages_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages_key=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PACKAGES_GPG_KEY is not set; skipping the APT and Flatpak repositories"
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.runner }}
    # The silent LTO link dominates; cap it so a real stall fails the job
    # instead of burning an hour of runner time.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config \
            build-essential patchelf file libfuse2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # One cache per target: the amd64 and arm64 legs otherwise derive the
          # same key from the shared `linux` job id and overwrite each other.
          shared-key: ${{ matrix.target }}
          # Keep the compiled deps when a later step fails, so a re-run resumes
          # from the cache instead of rebuilding ~1000 crates from scratch.
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install sops
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=sops-v3.13.2.linux.amd64 ;;
            Linux-ARM64) asset=sops-v3.13.2.linux.arm64 ;;
            *) echo "unsupported runner: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/getsops/sops/releases/download/v3.13.2/$asset" -o "$RUNNER_TEMP/sops"
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Decrypt build secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bash .mise/tasks/secrets-decrypt
          bash .mise/tasks/secrets-export-env
      - name: Seed the frontend dist directory
        # `tauri::generate_context!()` fails to compile while `build/` is absent,
        # and the bindings binary links the crate that invokes it — yet the real
        # frontend build needs the bindings that binary produces. Seeding the
        # path satisfies the macro; the frontend build replaces it further down
        # and tauri-build's rerun-if-changed recompiles the crate with the real
        # assets.
        run: |
          set -euo pipefail
          mkdir -p build
          if [ ! -f build/index.html ]; then
            printf '<!doctype html>\n' > build/index.html
          fi

      # bindings.ts is a pure function of the command list in the Rust sources,
      # so reuse the previous export when none of them changed — that keeps the
      # expensive workspace compile below off repeat runs (retags especially).
      - name: Restore generated IPC bindings
        id: bindings
        uses: actions/cache@v4
        with:
          path: web/lib/bindings.ts
          key: ipc-bindings-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'Cargo.lock') }}

      - name: Generate IPC bindings
        # Deliberately not --release. A release build links the entire workspace
        # with lto=true and codegen-units=1, which prints nothing for ~28 minutes
        # on the Intel runners — indistinguishable from a hang — and `tauri
        # build` pays that same link again for the app. This tool only writes
        # web/lib/bindings.ts, so an unoptimised build is enough.
        timeout-minutes: 45
        if: steps.bindings.outputs.cache-hit != 'true'
        run: cargo run --target "${{ matrix.target }}" --features bindings-export --bin generate-bindings

      # The frontend is built here rather than inside `tauri build` so it can be
      # cached across runs and so a broken web build fails before the expensive
      # Rust link. It has to come after the bindings step: web/lib/bindings.ts is
      # generated and imported by the app sources.
      - name: Cache frontend build
        id: frontend
        uses: actions/cache@v4
        with:
          path: |
            build
            .svelte-kit
          key: frontend-${{ runner.os }}-${{ hashFiles('web/**', 'static/**', 'scripts/**', 'svelte.config.js', 'vite.config.js', 'tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}

      - name: Build frontend
        if: steps.frontend.outputs.cache-hit != 'true'
        run: pnpm build

      - name: Build bundles
        # `build/` is already in place, so stop tauri from re-running the
        # beforeBuildCommand (`pnpm build`) from tauri.conf.json.
        run: pnpm tauri build --config '{"build":{"beforeBuildCommand":""}}' --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Upload rpm and AppImage
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-extra
          path: |
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: universal
            runner: macos-15
            target: universal-apple-darwin
    runs-on: ${{ matrix.runner }}
    # A universal leg compiles both architectures back to back (the Intel half
    # alone took ~75 minutes), so three hours means a hang.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Detect signing availability
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import Apple signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ matrix.arch }}
        run: |
          set -euo pipefail
          printf '%s' "$APPLE_CERTIFICATE" > certificate.b64
          if ! base64 --decode < certificate.b64 > certificate.p12 2>/dev/null; then
            base64 -D < certificate.b64 > certificate.p12
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          cert_id="$(security find-identity -v -p codesigning build.keychain | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$cert_id"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          # `universal-apple-darwin` is a Tauri pseudo-target that rustup does
          # not know; `tauri build` lipos the outputs of these two.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # One cache per target: the two macOS legs would otherwise share the
          # key derived from the `macos` job id and thrash each other.
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install sops
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            macOS-X64) asset=sops-v3.13.2.darwin.amd64 ;;
            macOS-ARM64) asset=sops-v3.13.2.darwin.arm64 ;;
            *) echo "unsupported runner: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/getsops/sops/releases/download/v3.13.2/$asset" -o "$RUNNER_TEMP/sops"
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Decrypt build secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bash .mise/tasks/secrets-decrypt
          bash .mise/tasks/secrets-export-env
      - name: Seed the frontend dist directory
        # See the Linux job: generate_context!() will not compile without this.
        run: |
          set -euo pipefail
          mkdir -p build
          if [ ! -f build/index.html ]; then
            printf '<!doctype html>\n' > build/index.html
          fi

      - name: Restore generated IPC bindings
        id: bindings
        uses: actions/cache@v4
        with:
          path: web/lib/bindings.ts
          key: ipc-bindings-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'Cargo.lock') }}

      - name: Generate IPC bindings
        # Same reasoning as the Linux job: reuse the cached export, and skip
        # --release, because the LTO link it triggers prints nothing for ~30
        # minutes on this runner and the DMG build pays that link again.
        timeout-minutes: 60
        if: steps.bindings.outputs.cache-hit != 'true'
        # No `--target`: `universal-apple-darwin` is a Tauri pseudo-target, not
        # cargo target, and the export does not depend on the architecture.
        run: cargo run --features bindings-export --bin generate-bindings

      - name: Cache frontend build
        id: frontend
        uses: actions/cache@v4
        with:
          path: |
            build
            .svelte-kit
          key: frontend-${{ runner.os }}-${{ hashFiles('web/**', 'static/**', 'scripts/**', 'svelte.config.js', 'vite.config.js', 'tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}

      - name: Build frontend
        if: steps.frontend.outputs.cache-hit != 'true'
        run: pnpm build

      # `tauri build` lipos only the app binary. For `externalBin` sidecars the
      # bundler instead looks for `<name>-universal-apple-darwin`, as documented
      # on `external_bin`, while build.rs stages one binary per architecture.
      # Fuse both architectures into the universal name before bundling.
      - name: Stage universal macOS sidecars
        timeout-minutes: 45
        run: |
          set -euo pipefail
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            for package in livtet-sync-daemon livtet-plugin-host; do
              cargo build --release -p "$package" --bin "$package" --target "$triple"
            done
          done
          for package in livtet-sync-daemon livtet-plugin-host; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$package" \
              "target/x86_64-apple-darwin/release/$package" \
              -output "crates/livtet-desktop/binaries/$package-universal-apple-darwin"
          done
          lipo -info crates/livtet-desktop/binaries/*-universal-apple-darwin

      - name: Build DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Extracted from the imported certificate by the "Import Apple
          # signing certificate" step above and written to $GITHUB_ENV.
          # Without it `tauri build` ships an unsigned binary and Gatekeeper
          # reports the DMG as broken.
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for var in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then unset "$var"; fi
          done
          # `build/` was produced and cached by the frontend step, so suppress
          # the beforeBuildCommand that tauri would otherwise run again.
          pnpm tauri build --config '{"build":{"beforeBuildCommand":""}}' --target "${{ matrix.target }}" --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
  windows:
    name: Windows ${{ matrix.arch }}
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            runner: windows-2022
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Node.js, PNPM, Rust
        run: |
          echo 'Windows runner: node and pnpm available'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install sops
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Windows-X64) asset=sops-v3.13.2.windows.amd64.exe ;;
            Windows-ARM64) asset=sops-v3.13.2.windows.arm64.exe ;;
            *) echo "unsupported runner: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/getsops/sops/releases/download/v3.13.2/$asset" -o "$RUNNER_TEMP/sops"
          chmod +x "$RUNNER_TEMP/sops"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Decrypt build secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          bash .mise/tasks/secrets-decrypt
          bash .mise/tasks/secrets-export-env
      - name: Seed the frontend dist directory
        run: |
          set -euo pipefail
          mkdir -p build
          if [ ! -f build/index.html ]; then
            printf '<!doctype html>
' > build/index.html
          fi
      - name: Restore generated IPC bindings
        id: bindings
        uses: actions/cache@v4
        with:
          path: web/lib/bindings.ts
          key: ipc-bindings-${{ hashFiles('crates/**/*.rs', 'crates/**/Cargo.toml', 'Cargo.lock') }}
      - name: Generate IPC bindings
        timeout-minutes: 60
        if: steps.bindings.outputs.cache-hit != 'true'
        run: cargo run --features bindings-export --bin generate-bindings
      - name: Cache frontend build
        id: frontend
        uses: actions/cache@v4
        with:
          path: |
            build
            .svelte-kit
          key: frontend-${{ runner.os }}-${{ hashFiles('web/**', 'static/**', 'scripts/**', 'svelte.config.js', 'vite.config.js', 'tsconfig.json', 'package.json', 'pnpm-lock.yaml') }}
      - name: Build frontend
        if: steps.frontend.outputs.cache-hit != 'true'
        run: pnpm build
      - name: Stage sidecar binaries
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # Clean up any pre-existing sidecar for this target to avoid stale
          # binaries from a prior run in the shared workspace.
          for package in livtet-sync-daemon livtet-plugin-host; do
            rm -f "crates/livtet-desktop/binaries/$package-${{ matrix.target }}.exe"
          done
          cargo build --release -p livtet-sync-daemon -p livtet-plugin-host --target "${{ matrix.target }}"
          for package in livtet-sync-daemon livtet-plugin-host; do
            cp "target/${{ matrix.target }}/release/$package.exe" "crates/livtet-desktop/binaries/$package-${{ matrix.target }}.exe"
          done
          ls -la crates/livtet-desktop/binaries/*-${{ matrix.target }}.exe
      - name: Build NSIS installer
        run: |
          pnpm tauri build --config '{"build":{"beforeBuildCommand":""}}' --target "${{ matrix.target }}" --bundles nsis
      - name: Upload Windows .exe installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis*.exe
          if-no-files-found: error



      - name: Build MSI installer
        run: |
          pnpm tauri build --config '{"build":{"beforeBuildCommand":""}}' --target "${{ matrix.target }}" --bundles msi

      - name: Upload Windows .msi installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-msi
          path: target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: error
  lint:
    name: Lint (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Lint (Rust + JS)
        run: mise run lint

  test:
    name: Test (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Test (Rust + JS)
        run: mise run test


  flatpak:
    name: Flatpak bundle
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: artifacts
      - name: Stage Flatpak tree from the Debian package
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          deb="$(find artifacts -name "livtet-desktop_${version}_amd64.deb" -print -quit)"
          test -n "$deb"
          rm -rf packaging/flatpak/staging
          mkdir -p packaging/flatpak/staging/usr/share/metainfo
          dpkg-deb -x "$deb" packaging/flatpak/staging
          cp packaging/flatpak/net.olamaelcu.livtet.metainfo.xml packaging/flatpak/staging/usr/share/metainfo/
      - name: Cache Flatpak runtime
        uses: actions/cache@v4
        with:
          path: |
            /var/lib/flatpak
            ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-
          restore-keys: |
            flatpak-${{ runner.os }}-
      - name: Install Flatpak toolchain and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          flatpak-builder --force-clean --disable-rofiles-fuse \
            --repo="$PWD/flatpak-repo" build-dir \
            packaging/flatpak/net.olamaelcu.livtet.yml
          mkdir -p dist
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$PWD/flatpak-repo" "dist/livtet-desktop_${version}_x86_64.flatpak" \
            net.olamaelcu.livtet
      - name: Install the bundle and verify the runtime
        run: |
          set -euo pipefail
          bundle="$(find dist -name '*.flatpak' -print -quit)"
          flatpak install --user -y --bundle "$bundle"
          flatpak build build-dir sh -c '
            for b in livtet-desktop livtet-plugin-host livtet-sync-daemon; do
              test -x "/app/bin/$b" || exit 1
              ldd "/app/bin/$b" | grep "not found" && exit 1
            done
            exit 0
          '
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [validate, linux, macos, flatpak, windows]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.flatpak' -o -name '*.msi' \) -exec cp {} out/ \n          (
            cd out
            find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS.txt"
            mv "$RUNNER_TEMP/SHA256SUMS.txt" SHA256SUMS.txt
            cat SHA256SUMS.txt
          )
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading assets"
          else
            gh release create "$TAG" \
              --title "Livtet ${{ needs.validate.outputs.version }}" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" out/* --clobber

  homebrew:
    name: Update Homebrew tap
    needs: [validate, release]
    if: needs.validate.outputs.homebrew_token == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Download macOS DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern 'livtet-desktop_*_universal.dmg' --dir dist
      - name: Render and push cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          universal_sha="$(sha256sum "dist/livtet-desktop_${VERSION}_universal.dmg" | cut -d' ' -f1)"
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__UNIVERSAL_SHA256__/${universal_sha}/g" \
            packaging/homebrew/livtet.rb.tmpl > /tmp/livtet.rb
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/olamaelcu/homebrew-tap.git" tap-repo
          mkdir -p tap-repo/Casks
          cp /tmp/livtet.rb tap-repo/Casks/livtet.rb
          git -C tap-repo config user.name 'github-actions[bot]'
          git -C tap-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C tap-repo add Casks/livtet.rb
          if git -C tap-repo diff --cached --quiet; then
            echo 'cask is already up to date'
          else
            git -C tap-repo commit -m "livtet ${VERSION}"
            git -C tap-repo push
          fi

  publish-pages:
    name: Publish APT and Flatpak repositories
    needs: [validate, release, linux, flatpak]
    if: needs.validate.outputs.packages_key == 'true'
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: 'linux-*'
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: artifacts-flatpak
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg flatpak
      - name: Import package signing key
        env:
          PACKAGES_GPG_KEY: ${{ secrets.PACKAGES_GPG_KEY }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$PACKAGES_GPG_KEY" | gpg --batch --import
          keyid="$(gpg --with-colons --list-secret-keys | awk -F: '/^fpr:/{print $10; exit}')"
          test -n "$keyid"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "KEYID=$keyid" >> "$GITHUB_ENV"
      - name: Check out the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$remote" pages
          else
            mkdir pages
            git -C pages init -b gh-pages
            git -C pages remote add origin "$remote"
          fi
          touch pages/.nojekyll
          # Pages binds the custom domain through a file in the branch, and this
          # job rewrites the branch on every release: write it on each run so a
          # settings reset cannot silently move the site back to the github.io
          # host. `PACKAGES_URL` is the single source for the domain.
          printf '%s\n' "${PACKAGES_URL#https://}" > pages/CNAME
          # The downloads homepage ships with the repository so it is reviewed
          # with everything else; a tag cut before it existed simply has none.
          homepage="$GITHUB_WORKSPACE/packaging/pages/index.html"
          if [ -f "$homepage" ]; then
            install -D -m 644 "$homepage" pages/index.html
          fi
      - name: Build APT repository
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          install -d pages/apt/pool/main/l/livtet-desktop
          install -d pages/apt/dists/stable/main/binary-amd64
          install -d pages/apt/dists/stable/main/binary-arm64
          find artifacts -name '*.deb' -exec cp {} pages/apt/pool/main/l/livtet-desktop/ \;
          find pages/apt/pool/main/l/livtet-desktop -name '*.deb' ! -name "livtet-desktop_${version}_*.deb" -delete
          (
            cd pages/apt
            dpkg-scanpackages -m -a amd64 pool > dists/stable/main/binary-amd64/Packages
            dpkg-scanpackages -m -a arm64 pool > dists/stable/main/binary-arm64/Packages
            gzip -9kf dists/stable/main/binary-amd64/Packages dists/stable/main/binary-arm64/Packages
            apt-ftparchive -c "$GITHUB_WORKSPACE/packaging/apt/apt-ftparchive.conf" release dists/stable > dists/stable/Release
            gpg --batch --yes --default-key "$KEYID" --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --batch --yes --default-key "$KEYID" --detach-sign --output dists/stable/Release.gpg dists/stable/Release
            gpg --armor --export "$KEYID" > livtet.asc
            printf '%s\n' "deb [signed-by=/usr/share/keyrings/livtet.asc] ${PACKAGES_URL}/apt stable main" > livtet.list
          )
      - name: Build Flatpak repository
        run: |
          set -euo pipefail
          bundle="$(find artifacts-flatpak -name '*.flatpak' -print -quit)"
          test -n "$bundle"
          install -d pages/flatpak
          flatpak build-import-bundle --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" pages/flatpak/repo "$bundle"
          flatpak build-update-repo --gpg-sign="$KEYID" --gpg-homedir="$GNUPGHOME" \
            --generate-static-deltas --prune --prune-depth=1 --title=Livtet \
            pages/flatpak/repo
          key_b64="$(gpg --export "$KEYID" | base64 -w0)"
          printf '%s\n' \
            '[Flatpak Repo]' \
            'Title=Livtet' \
            "Url=${PACKAGES_URL}/flatpak/repo/" \
            'Homepage=https://github.com/olamaelcu/livtet-desktop' \
            'Comment=Livtet desktop releases' \
            "GPGKey=${key_b64}" \
            > pages/flatpak/livtet.flatpakrepo
      - name: Commit and push
        run: |
          set -euo pipefail
          git -C pages config user.name 'github-actions[bot]'
          git -C pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C pages add -A
          if git -C pages diff --cached --quiet; then
            echo 'no pages changes'
          else
            git -C pages commit -m "packages: livtet ${{ needs.validate.outputs.version }}"
            git -C pages push origin gh-pages
          fi
