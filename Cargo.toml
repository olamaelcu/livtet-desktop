[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
livtet-core = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-types = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-search = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-data = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-sync = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-sync-http = { git = "https://github.com/olamaelcu/livtet", branch = "main", features = ["poem"] }
livtet-sync-server = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-epub = { path = "crates/livtet-epub" }
livtet-importer-types = { path = "crates/livtet-importer-types" }
livtet-audio = { path = "crates/livtet-audio" }
mp4ameta = "0.13"
livtet-mobi = { path = "crates/livtet-mobi" }
livtet-pdf = { path = "crates/livtet-pdf" }
livtet-importer = { path = "crates/livtet-importer" }
stanchion = { git = "https://github.com/jalcine/stanchion", branch = "main", features = ["remote", "lua54", "vendored"] }
livtet-opds-client = { git = "https://github.com/olamaelcu/livtet-opds", branch = "main", features = ["atom"] }
livtet-opds-types = { git = "https://github.com/olamaelcu/livtet-opds", branch = "main" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
