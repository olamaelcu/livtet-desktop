[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
# NOTE: local-dev override — points at the sibling core checkout so the new
# sync crates resolve. Revert to git (`branch = "main"`) once core is pushed.
livtet-core        = { path = "../core/livtet-core" }
livtet-types       = { path = "../core/livtet-types" }
livtet-search      = { path = "../core/livtet-search" }
livtet-data        = { path = "../core/livtet-data" }
livtet-sync        = { path = "../core/livtet-sync" }
livtet-sync-http   = { path = "../core/livtet-sync-http", features = ["poem"] }
livtet-sync-server = { path = "../core/livtet-sync-server" }
livtet-epub = { path = "crates/livtet-epub" }
livtet-importer = { path = "crates/livtet-importer" }
stanchion = { git = "https://github.com/jalcine/stanchion", branch = "main", features = ["remote", "lua54", "vendored"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
