[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# See clippy.toml for disallowed types / methods (time over chrono, camino over std::path,
# fs_err over std::fs / tokio::fs).

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[workspace.dependencies]
livtet-core = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-types = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-search = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-data = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-sync = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-sync-http = { git = "https://github.com/olamaelcu/livtet", branch = "main", features = [
  "poem",
] }
livtet-sync-server = { git = "https://github.com/olamaelcu/livtet", branch = "main" }
livtet-epub = { path = "crates/livtet-epub" }
livtet-importer-types = { path = "crates/livtet-importer-types" }
livtet-audio = { path = "crates/livtet-audio" }
mp4ameta = "0.13"
livtet-mobi = { path = "crates/livtet-mobi" }
livtet-pdf = { path = "crates/livtet-pdf" }
livtet-importer = { path = "crates/livtet-importer" }
livtet-reader = { path = "crates/livtet-reader" }
stanchion = { git = "https://github.com/jalcine/stanchion", branch = "main", features = [
  "remote",
] }
stanchion-lua = { git = "https://github.com/jalcine/stanchion", branch = "main", features = [
  "lua54",
  "vendored",
] }
stanchion-abi = { git = "https://github.com/jalcine/stanchion", branch = "main" }
livtet-opds-client = { git = "https://github.com/olamaelcu/livtet-opds", branch = "main", features = [
  "atom",
] }
livtet-opds-types = { git = "https://github.com/olamaelcu/livtet-opds", branch = "main" }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "blocking",
] }
url = "2"
pdf_oxide = { git = "https://github.com/yfedoseev/pdf_oxide", branch = "main" }
atrium-api = "0.25"
atrium-common = "0.1"
atrium-identity = { version = "0.1", default-features = false }
atrium-oauth = { version = "0.1", default-features = false }
atrium-xrpc = "0.12"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
atrium-xrpc-client = { version = "0.5", default-features = false, features = [
  "reqwest",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `tauri-plugin-deep-link` 2.6.2 builds `rust-ini::ParseOption` with a struct
# literal that predates the two fields added in 0.21.3. The local copy adds
# `..Default::default()`; drop it once upstream ships a fix.
[patch.crates-io]
tauri-plugin-deep-link = { path = "vendor/tauri-plugin-deep-link" }
# 0.1.7 hardcodes `redirect_uris[0]` at the token endpoint (breaking any flow
# that authorized with another listed URI) and turns an exchange failure into
# `todo!()`. The local copy threads the authorized URI through and reports the
# real error. Drop it once upstream does the same.
atrium-oauth = { path = "vendor/atrium-oauth" }
