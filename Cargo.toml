[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.package]
edition = "2024"
rust-version = "1.97.0"
authors = ["Jacky Alcine <yo@jacky.wtf>"]

[workspace.dependencies]
livtet-core = { path = "../mobile/core/livtet-core" }
livtet-types = { path = "../mobile/core/livtet-types" }
livtet-search = { path = "../mobile/core/livtet-search" }
livtet-data = { path = "../mobile/core/livtet-data" }
livtet-sync = { path = "../mobile/core/livtet-sync" }
livtet-sync-server = { path = "../mobile/core/livtet-sync-server" }
livtet-epub = { path = "crates/livtet-epub" }
livtet-importer-types = { path = "crates/livtet-importer-types" }
livtet-audio = { path = "crates/livtet-audio" }
mp4ameta = "0.13"
livtet-mobi = { path = "crates/livtet-mobi" }
livtet-pdf = { path = "crates/livtet-pdf" }
livtet-importer = { path = "crates/livtet-importer" }
livtet-reader = { path = "crates/livtet-reader" }
livtet-mcp-server = { path = "crates/livtet-mcp-server" }
livtet-opds-live = { path = "crates/livtet-opds-live" }
stanchion = { git = "https://github.com/jalcine/stanchion", branch = "main", features = [
  "remote",
] }
stanchion-lua = { git = "https://github.com/jalcine/stanchion", branch = "main", features = [
  "lua54",
  "vendored",
] }
stanchion-abi = { git = "https://github.com/jalcine/stanchion", branch = "main" }
# Local checkout until the core-free opds-server lands on its branch; the crates
# no longer depend on livtet core, so no source patch is needed.
livtet-opds-client = { path = "../livtet-opds/opds", features = ["atom"] }
livtet-opds-types = { path = "../livtet-opds/opds-types" }
livtet-opds-server = { path = "../livtet-opds/opds-server" }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
  "blocking",
] }
url = "2"
pdf_oxide = { git = "https://github.com/yfedoseev/pdf_oxide", branch = "main" }
atrium-api = "0.25"
atrium-common = "0.1"
atrium-identity = { version = "0.1", default-features = false }
atrium-oauth = { version = "0.1.7", default-features = false }
atrium-xrpc = "0.12"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
atrium-xrpc-client = { version = "0.5", default-features = false, features = [
  "reqwest",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `tauri-plugin-deep-link` 2.6.2 builds `rust-ini::ParseOption` with a struct
# literal that predates the two fields added in 0.21.3. The local copy adds
# `..Default::default()`; drop it once upstream ships a fix.
[patch.crates-io]
tauri-plugin-deep-link = { path = "vendor/tauri-plugin-deep-link" }
# 0.1.7 hardcodes `redirect_uris[0]` at the token endpoint (breaking any flow
# that authorized with another listed URI) and turns an exchange failure into
# `todo!()`. The local copy threads the authorized URI through and reports the
# real error. Drop it once upstream does the same.
atrium-oauth = { path = "vendor/atrium-oauth" }
# 0.18.4 lets `windows` and `windows-core` resolve to different minor versions,
# which breaks every Windows build (`IWbemObjectSink: windows_core::Interface is
# not satisfied`) as soon as tauri's tao pins core 0.62 while
# tauri-plugin-opener pins windows 0.61. The local copy holds both below 0.62 so
# the pair always matches. Drop it once upstream constrains them together.
wmi = { path = "vendor/wmi" }
