[workspace]
resolver = "2"
members = ["tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.97.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[patch.'https://github.com/olamaelcu/livtet']
livtet-core = { path = "../core/livtet-core" }
livtet-search = { path = "../core/livtet-search" }
