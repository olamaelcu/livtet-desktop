[tools]
"aqua:getsops/sops" = "3.13.2"
"aqua:age" = "1.3.1"
"aqua:jqlang/jq" = "1.8.2"
adr-tools = "latest"
taskwarrior = "3.4.2"
"pipx:taskwarrior-mcp" = "0.2.0"
"pipx:diff-cover" = "10.6"
pnpm = "10"
"cargo:cargo-machete" = "0.7"
"cargo:cargo-llvm-cov" = "0.9"
"github:corca-ai/nose" = "v0.20.0"
"npm:@hypothesi/tauri-mcp-cli" = "0.10.0"

[env]
_.file = ".mise/secrets.env"
RUST_BACKTRACE = "full"
TASKRC = "{{ [config_root, '.taskrc']   | join_path }}"
TASKDATA = "{{ [config_root, '.taskdata'] | join_path }}"
CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG = true
RUST_LOG = "tao=warn,wry=warn,log=warn,trace"

[tasks.generate-bindings]
depends = ["secrets-export-env"]
run = "cargo run --bin generate-bindings"

[tasks.dev]
depends = ["generate-bindings"]
run = ["cargo build -p livtet-plugin-host", "pnpm tauri dev"]

# --- Local parity with CI ---

[tasks.lint]
description = "Run all lint checks (Rust + JS/TS)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo-machete",
  "pnpm lint",
]

[tasks.test]
description = "Run all unit + integration tests (Rust + JS/TS)"
run = [
  "cargo test --doc --workspace",
  "cargo test --workspace --all-targets",
  "pnpm test",
]

[tasks."test:e2e:browser"]
description = "Run E2E tests in browser-only mode (mocked IPC)"
run = "pnpm test:e2e:browser"

[tasks.fix]
description = "Auto-fix formatting (Rust + JS/TS)"
run = [
  "cargo fmt",
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
  "cargo-machete",
  "pnpm lint --fix || pnpm lint",
]

[tasks.ci]
description = "Full CI suite (lint + test)"
depends = ["lint", "test"]

[tasks.check-dupes]
description = "Detect copy-paste duplication (15+ lines)"
run = "nose query . --mode syntax 'lines>15' --format json > check-dupes.json || true"
depends = ["secrets-export-env"]

[tasks."coverage:web"]
description = "Frontend coverage (vitest unit + browser) → coverage/lcov.info"
run = "pnpm test:coverage"

[tasks."coverage:rust"]
description = "Rust coverage (workspace) → target/coverage/rust.lcov"
run = [
  # cargo-llvm-cov will not create the output directory itself.
  "mkdir -p target/coverage",
  # test_support.rs files are test scaffolding, not product code -- the
  # frontend config excludes web/tests/** for the same reason (ADR 38).
  "cargo llvm-cov --workspace --all-targets --ignore-filename-regex '(test_support|generate-bindings)\\.rs$' --lcov --output-path target/coverage/rust.lcov",
]

[tasks.coverage]
description = "Both coverage reports (Rust + frontend), HTML in coverage/"
depends = ["coverage:rust", "coverage:web"]

[tasks."coverage:gate"]
description = "Normalize, run the fail-closed preflight, then score patch coverage"
depends = ["coverage"]
run = [
  # Refuses to proceed unless the lcov-to-diff join is sound (ADR 38).
  "node scripts/normalize-lcov.mjs",
  # This repository's remote is `github`, not `origin`; CI's checkout
  # provides origin/main, so that is the default and locals override it.
  "diff-cover target/coverage/rust.norm.lcov target/coverage/web.norm.lcov --compare-branch=${COVERAGE_COMPARE_BRANCH:-origin/main} --fail-under=85 --markdown-report target/coverage/patch.md --html-report target/coverage/patch.html",
]
