[tools]
"aqua:getsops/sops" = "3.13.2"
"aqua:age" = "1.3.1"
"aqua:jqlang/jq" = "1.8.2"
adr-tools = "latest"
taskwarrior = "3.4.2"
"pipx:taskwarrior-mcp" = "0.2.0"
"pipx:diff-cover" = "10.6"
pnpm = "10"
"cargo:cargo-machete" = "0.7"
"cargo:cargo-llvm-cov" = "0.9"
"github:corca-ai/nose" = "v0.20.0"
"npm:@hypothesi/tauri-mcp-cli" = "0.10.0"

[env]
_.file = ".mise/secrets.env"
RUST_BACKTRACE = "full"
TASKRC = "{{ [config_root, '.taskrc']   | join_path }}"
TASKDATA = "{{ [config_root, '.taskdata'] | join_path }}"
CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG = true
RUST_LOG = "tao=warn,wry=warn,log=warn,trace"

[tasks.generate-bindings]
depends = ["secrets-export-env"]
run = "cargo run --features bindings-export --bin generate-bindings"

[tasks."dev:atproto"]
description = "Dev app with ATProto OAuth logging (identity, authorize URL, callback, token exchange, appview)"
# `atrium-oauth` has no logging of its own, so these directives surface our
# instrumentation in `src/atproto/` and the command wrappers without the
# reqwest/tantivy trace flood.
env = { RUST_LOG = "livtet_desktop_lib::atproto=trace,livtet_desktop_lib::commands::atproto=trace,info" }
depends = ["generate-bindings"]
run = ["cargo build -p livtet-plugin-host", "pnpm tauri dev"]

[tasks.dev]
depends = ["generate-bindings"]
run = ["cargo build -p livtet-plugin-host", "pnpm tauri dev"]

# --- Local parity with CI ---

[tasks.lint]
description = "Run all lint checks (Rust + JS/TS)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo-machete",
  "pnpm lint",
]

[tasks.test]
description = "Run all unit + integration tests (Rust + JS/TS)"
run = [
  "cargo test --doc --workspace",
  "cargo test --workspace --all-targets",
  "pnpm test",
]

[tasks."test:e2e:browser"]
description = "Run E2E tests in browser-only mode (mocked IPC)"
run = "pnpm test:e2e:browser"

[tasks.fix]
description = "Auto-fix formatting (Rust + JS/TS)"
run = [
  "cargo fmt",
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
  "cargo-machete",
  "pnpm lint --fix || pnpm lint",
]

[tasks.ci]
description = "Full CI suite (lint + test)"
depends = ["lint", "test"]

[tasks.check-dupes]
description = "Detect copy-paste duplication (15+ lines)"
run = "nose query . --mode syntax 'lines>15' --format json > check-dupes.json || true"
depends = ["secrets-export-env"]

[tasks."coverage:web"]
description = "Frontend coverage (vitest unit + browser) → coverage/lcov.info"
run = "pnpm test:coverage"

[tasks."coverage:rust"]
description = "Rust coverage (workspace) → target/llvm-cov/rust.lcov"
run = [
  # cargo llvm-cov uses its own instrumented build dir (target/llvm-cov-target)
  # separate from the normal cargo cache, so a coverage run doesn't invalidate it.
  # `report` merges every instrumented binary it finds there, so stale test
  # binaries from earlier builds (with outdated line maps) skew the numbers;
  # clean workspace artifacts first. Dependencies stay cached.
  "mkdir -p target/llvm-cov",
  "cargo llvm-cov clean --workspace",
  # coverage-ignore.txt also carries Vitest globs (e.g. `**/*.test.ts`), which are
  # invalid ERE and make llvm-cov silently drop every exclusion; skip web patterns.
  "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | grep -vE '^web/|\\.(ts|mjs)$' | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov --workspace --all-targets --no-report --ignore-filename-regex \"($regex)\"",
  "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | grep -vE '^web/|\\.(ts|mjs)$' | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov report --lcov --output-path target/llvm-cov/rust.lcov --ignore-filename-regex \"($regex)\"",
]

[tasks."coverage:clean"]
description = "Clean separate coverage build directory. Deleting target/llvm-cov-target prevents stale objects from deleted/renamed source from polluting future reports (same rationale as core)."
run = [
  "rm -rf target/llvm-cov-target target/llvm-cov",
  "mise run coverage:rust",
]

[tasks."coverage:html"]
description = "Generate browsable HTML coverage report from the separate build dir"
depends = ["coverage:rust"]
run = [
  "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | grep -vE '^web/|\\.(ts|mjs)$' | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov report --html --ignore-filename-regex \"($regex)\"",
]

[tasks."coverage:check"]
description = "Fail when workspace line coverage drops below 90%. Floor is workspace-wide (not per-crate) — mirrors core's rationale (some crates are dominated by process lifecycle). See coverage-ignore.txt for what is excluded."
depends = ["coverage:rust"]
run = [
  "regex=$(grep -vE '^[[:space:]]*(#|$)' coverage-ignore.txt | grep -vE '^web/|\\.(ts|mjs)$' | paste -sd'|' -) && [ -n \"$regex\" ] && cargo llvm-cov report --summary-only --fail-under-lines 90 --ignore-filename-regex \"($regex)\"",
]

[tasks.coverage]
description = "Both coverage reports (Rust + frontend), reports in target/llvm-cov/"
depends = ["coverage:rust", "coverage:web"]

[tasks."coverage:gate"]
description = "Normalize, run the fail-closed preflight, then score patch coverage"
depends = ["coverage"]
run = [
  # Refuses to proceed unless the lcov-to-diff join is sound (ADR 38).
  "node scripts/normalize-lcov.mjs",
  # Reports live in target/llvm-cov/ (separate build dir, matching core convention).
  # This repository's remote is `github`, not `origin`; CI's checkout
  # provides origin/main, so that is the default and locals override it.
  "diff-cover target/llvm-cov/rust.norm.lcov target/llvm-cov/web.norm.lcov --compare-branch=${COVERAGE_COMPARE_BRANCH:-origin/main} --fail-under=85 --markdown-report target/llvm-cov/patch.md --html-report target/llvm-cov/patch.html",
]
