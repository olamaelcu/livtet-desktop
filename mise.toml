[tools]
"aqua:getsops/sops" = "3.13.2"
"aqua:age" = "1.3.1"
"aqua:jqlang/jq" = "1.8.2"
adr-tools = "latest"
taskwarrior = "3.4.2"
"pipx:taskwarrior-mcp" = "0.2.0"
pnpm = "10"
"cargo:cargo-machete" = "0.7"
"github:corca-ai/nose" = "v0.20.0"

[env]
_.file = ".mise/secrets.env"
RUST_BACKTRACE = "full"
TASKRC = "{{ [config_root, '.taskrc']   | join_path }}"
TASKDATA = "{{ [config_root, '.taskdata'] | join_path }}"
RUST_LOG = "tao=warn,wry=warn,log=warn,trace"

[tasks.generate-bindings]
run = "cargo run --bin generate-bindings"

[tasks.dev]
depends = ["generate-bindings", "secrets-export-env"]
run = "pnpm tauri dev"

# --- Local parity with CI ---

[tasks.lint]
description = "Run all lint checks (Rust + JS/TS)"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo-machete",
  "pnpm lint",
]

[tasks.test]
description = "Run all tests (Rust + JS/TS)"
run = ["cargo test --workspace --all-targets", "pnpm test"]

[tasks."test:e2e:browser"]
description = "Run E2E tests in browser-only mode (mocked IPC)"
run = "pnpm test:e2e:browser"

[tasks.fix]
description = "Auto-fix formatting (Rust + JS/TS)"
run = [
  "cargo fmt",
  "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged -- -D warnings",
  "cargo-machete",
  "pnpm lint --fix || pnpm lint",
]

[tasks.ci]
description = "Full CI suite (lint + test) — same as GitHub Actions"
depends = ["lint", "test"]

[tasks.check-dupes]
description = "Detect copy-paste duplication (15+ lines)"
run = "nose query . --mode syntax 'lines>15' --format json > check-dupes.json || true"
depends = ["secrets-export-env"]

