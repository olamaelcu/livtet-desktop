[package]
name = "livtet-plugin-host"
version = "0.1.0"
edition.workspace = true
authors = ["olamaelcu"]
license = "MPL-2.0"
description = "Out-of-process host that runs Livtet's signed Lua plugins, isolated from the app"
publish = false

[[bin]]
name = "livtet-plugin-host"
path = "src/main.rs"

[dependencies]
stanchion.workspace = true
stanchion-lua.workspace = true
stanchion-abi = { workspace = true }
livtet-epub.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
fs-err = { version = "3.3.1", features = ["tokio"] }
camino = { version = "1.2.6", features = ["serde1"] }
serde_json = "1.0.151"

[lints]
workspace = true
