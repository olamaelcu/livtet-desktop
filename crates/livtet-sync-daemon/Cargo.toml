[package]
name = "livtet-sync-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
description = "Livtet sync daemon sidecar"
publish = false

[[bin]]
name = "livtet-sync-daemon"
path = "src/main.rs"

[dependencies]
livtet-sync-server.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
