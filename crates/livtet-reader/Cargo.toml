[package]
name = "livtet-reader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["olamaelcu"]
license = "MPL-2.0"
description = "EPUB to Readium Web Publication streamer for the Livtet reader"
publish = false

[dependencies]
livtet-epub = { path = "../livtet-epub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
