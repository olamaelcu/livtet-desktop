[package]
name = "livtet-reader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MPL-2.0"
description = "EPUB to Readium Web Publication streamer for the Livtet reader"
publish = false

[dependencies]
livtet-epub = { path = "../livtet-epub" }
livtet-importer-types = { workspace = true }
camino = "1.2"
fs-err = "3.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3.27"
quick-xml = "0.42"
zip = "9.1"

[dev-dependencies]
tempfile = "3"
quick-xml = "0.42"
zip = { version = "9.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
