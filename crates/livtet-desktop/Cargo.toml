[package]
name = "livtet-desktop"
version = "0.1.0"
description = "A Tauri-powered application for showing the Livtet experience"
authors = ["Jacky Alcine <yo@jacky.wtf>"]
edition.workspace = true
rust-version.workspace = true
license = "MPL-2.0"
default-run = "livtet-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "livtet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
config = "0.15"
serde = { version = "1", features = ["derive"] }

[dependencies]
# Tauri dependencies
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-decorum = { git = "https://github.com/olamaelcu/tauri-plugin-decorum" }
tauri-plugin-mcp-bridge = "0.13"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"

# Livtet dependencies
livtet-core.workspace = true
livtet-types.workspace = true
livtet-search.workspace = true
livtet-sync-server.workspace = true
livtet-importer.workspace = true
stanchion.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"

camino = { version = "1.2", features = ["serde1"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-forest = { version = "0.3", features = ["env-filter"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
miette = "7.6"
thiserror = "2.0"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
fs-err = { version = "3.3", features = ["debug", "tokio"] }
tokio = { version = "1", features = [
  "sync",
  "macros",
  "rt-multi-thread",
  "process",
  "io-util",
  "time",
] }
time = { version = "0.3", features = ["formatting"] }
tauri-plugin-playwright = "0.4"

[features]
default = ["tauri/custom-protocol"]
e2e-testing = []

# `tauri-plugin-mcp-bridge` is granted through capabilities/ but never named in
# Rust source, so the detector cannot see the use.
[package.metadata.cargo-machete]
ignored = ["tauri-plugin-mcp-bridge"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
