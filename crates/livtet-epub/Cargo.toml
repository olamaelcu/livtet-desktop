[package]
name = "livtet-epub"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "MPL-2.0"
description = "EPUB parsing and metadata extraction for Livtet imports"
publish = false

[dependencies]
flate2 = "1"
livtet-importer-types.workspace = true
livtet-types.workspace = true
quick-xml = "0.42"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
camino = "1.2"
fs-err = "3.3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
