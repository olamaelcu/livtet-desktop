[package]
name = "livtet-epub"
version = "0.1.0"
edition.workspace = true
authors = ["olamaelcu"]
license = "MPL-2.0"
description = "EPUB parsing and metadata extraction for Livtet imports"
publish = false

[dependencies]
flate2 = "1"
livtet-importer-types.workspace = true
livtet-types.workspace = true
quick-xml = "0.42"
thiserror = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
